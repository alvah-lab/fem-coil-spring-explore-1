[project]
name = "honeycomb_host"
version = "0.1.0"
description = "方案C 19 单元蜂窝涡流触觉传感器主机软件栈: 数字孪生 / 快速正演 / 跟踪反演 / UDP 协议 / PyQt GUI"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12"]
[project.optional-dependencies]
gui = ["PyQt6", "pyqtgraph>=0.13.7"]
test = ["pytest"]
[tool.pytest.ini_options]
testpaths = ["tests"]
